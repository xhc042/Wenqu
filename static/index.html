<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问渠（Wenqu）v1.1</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-container">

    <!-- ==================== 侧边栏 ==================== -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="logo">🌊</span>
            <div>
                <h1>问渠</h1>
                <div class="version">v1.1</div>
            </div>
        </div>

        <div class="sidebar-nav">
            <button class="nav-btn active" data-view="dashboard">
                <span class="nav-icon">📊</span>
                <span>仪表盘</span>
            </button>
            <button class="nav-btn" data-view="create-course">
                <span class="nav-icon">➕</span>
                <span>新建课程</span>
            </button>
        </div>

        <div class="sidebar-content" id="sidebar-course-list">
            <div class="empty-state" style="padding:20px">
                <p style="color:#636e72;font-size:13px">加载中...</p>
            </div>
        </div>
    </aside>

    <!-- ==================== 主区域 ==================== -->
    <main class="main-area">

        <!-- 头部 -->
        <div class="main-header">
            <h2 id="page-title">📊 仪表盘</h2>
            <div class="header-actions">
                <button class="btn btn-outline btn-sm" onclick="switchView('dashboard')">🏠</button>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="main-content">

            <!-- ==================== 仪表盘 ==================== -->
            <div class="page-panel active" id="page-dashboard">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">📚</div>
                        <div class="stat-value" id="stat-courses">0</div>
                        <div class="stat-label">课程总数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">✅</div>
                        <div class="stat-value" id="stat-completed">0</div>
                        <div class="stat-label">已掌握项</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🔥</div>
                        <div class="stat-value" id="stat-heat-total">0</div>
                        <div class="stat-label">学习活动</div>
                    </div>
                </div>

                <div class="heatmap-container">
                    <h3 style="margin-bottom:8px">📈 学习足迹</h3>
                    <div class="heatmap-grid" id="heatmap-grid"></div>
                    <div class="heatmap-legend" id="heatmap-legend"></div>
                    <div class="daily-summary" id="daily-summary"></div>
                </div>

                <h3 style="margin-bottom:12px">📖 最近课程</h3>
                <div id="recent-courses"></div>
            </div>

            <!-- ==================== 创建课程 ==================== -->
            <div class="page-panel" id="page-create-course">
                <div class="create-options">
                    <div class="create-card" onclick="showUploadArea('upload')">
                        <div class="card-icon">📁</div>
                        <div class="card-title">上传文件</div>
                        <div class="card-desc">PDF/EPUB/MD/TXT</div>
                    </div>
                    <div class="create-card" onclick="showUploadArea('url')">
                        <div class="card-icon">🔗</div>
                        <div class="card-title">URL 抓取</div>
                        <div class="card-desc">从网页导入文章</div>
                    </div>
                    <div class="create-card" onclick="showUploadArea('text')">
                        <div class="card-icon">📝</div>
                        <div class="card-title">粘贴文本</div>
                        <div class="card-desc">直接粘贴内容</div>
                    </div>
                    <div class="create-card" onclick="showUploadArea('recommend')">
                        <div class="card-icon">📖</div>
                        <div class="card-title">空书架</div>
                        <div class="card-desc">AI推荐教材</div>
                    </div>
                </div>

                <div style="background:var(--bg-secondary);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)">
                    <input type="hidden" id="upload-type" value="upload">
                    <input type="hidden" id="file-path" value="">
                    <input type="hidden" id="file-source-type" value="">

                    <div class="form-group">
                        <label>课程名称</label>
                        <input type="text" id="course-title-input" placeholder="输入课程名称..." style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px">
                    </div>

                    <!-- 文件上传 -->
                    <div id="upload-area">
                        <div class="upload-zone" id="file-drop-zone">
                            <div class="upload-icon">📤</div>
                            <div class="upload-text">拖放文件到此处，或点击选择</div>
                            <div class="upload-hint">支持 PDF、EPUB、MD、TXT 格式</div>
                            <div id="file-name" style="display:none;margin-top:12px;font-weight:500"></div>
                        </div>
                        <input type="file" id="file-input" accept=".pdf,.epub,.md,.txt" style="display:none">
                    </div>

                    <!-- URL -->
                    <div id="url-area" style="display:none;margin-top:8px">
                        <label>网页URL</label>
                        <div class="input-group" style="margin-top:8px">
                            <input type="url" id="url-input" placeholder="https://example.com/article">
                        </div>
                    </div>

                    <!-- 文本 -->
                    <div id="text-paste-area" style="display:none;margin-top:8px">
                        <label>粘贴文本内容</label>
                        <textarea id="text-content" rows="8" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;margin-top:8px;font-family:inherit" placeholder="在此粘贴教材或文章内容..."></textarea>
                    </div>

                    <!-- 空书架 -->
                    <div id="recommend-area" style="display:none;margin-top:8px">
                        <label>输入想学的课题</label>
                        <div class="input-group" style="margin-top:8px">
                            <input type="text" id="book-search-input" placeholder="例如：量子力学入门、Python数据分析">
                            <button class="btn btn-primary" onclick="searchBooks()">🔍 搜索推荐</button>
                        </div>
                        <div id="recommend-results" style="margin-top:12px"></div>
                    </div>

                    <div style="margin-top:16px;display:flex;gap:8px">
                        <button class="btn btn-primary" onclick="submitCreateCourse()">🚀 创建课程</button>
                        <button class="btn btn-outline" onclick="switchView('dashboard')">取消</button>
                    </div>
                </div>
            </div>

            <!-- ==================== 课程详情 ==================== -->
            <div class="page-panel" id="page-course-detail">
                <div id="course-header"></div>
                <div id="course-progress"></div>
                <div id="defense-banner" class="defense-banner"></div>

                <h3 style="margin-bottom:12px">📖 章节列表</h3>
                <div id="chapter-list" class="chapter-list"></div>

                <!-- 课后产出物 -->
                <div class="post-class-section">
                    <div class="post-class-tabs">
                        <button class="post-class-tab active" data-tab="profile" onclick="switchPostTab('profile')">🧠 学习画像</button>
                        <button class="post-class-tab" data-tab="affinities" onclick="switchPostTab('affinities')">❤️ 情感分</button>
                        <button class="post-class-tab" data-tab="diaries" onclick="switchPostTab('diaries')">📝 日记</button>
                        <button class="post-class-tab" data-tab="group-chats" onclick="switchPostTab('group-chats')">💬 群聊</button>
                        <button class="post-class-tab" data-tab="summaries" onclick="switchPostTab('summaries')">📋 总结</button>
                        <button class="post-class-tab" data-tab="history" onclick="switchPostTab('history')">📚 学习记录</button>
                    </div>
                    <div class="post-class-content active" id="post-profile"></div>
                    <div class="post-class-content" id="post-affinities"></div>
                    <div class="post-class-content" id="post-diaries"></div>
                    <div class="post-class-content" id="post-group-chats"></div>
                    <div class="post-class-content" id="post-summaries"></div>
                    <div class="post-class-content" id="post-history"></div>
                </div>

                <!-- 证书 -->
                <h3 style="margin:24px 0 12px">🎓 已获证书</h3>
                <div id="certificates-list"></div>
            </div>

            <!-- ==================== 对话 ==================== -->
            <div class="page-panel" id="page-chat">
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages">
                        <div class="empty-state" style="padding:40px">
                            <div class="empty-icon">💬</div>
                            <h3>开始对话</h3>
                            <p>AI正在准备教材内容...</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <textarea id="chat-input" placeholder="输入你的回答..." disabled></textarea>
                        <button class="send-btn" id="send-btn" onclick="sendChatMessage()" disabled>➤</button>
                        <button class="btn btn-outline btn-sm" onclick="endChat()" style="height:48px">结束</button>
                    </div>
                    <div class="chat-status" id="chat-status">正在初始化...</div>
                </div>
            </div>

            <!-- ==================== 结业答辩 ==================== -->
            <div class="page-panel" id="page-defense">
                <div id="defense-questions"></div>
            </div>

        </div>
    </main>
</div>

<!-- ==================== 学习契约弹窗 ==================== -->
<div class="modal-overlay" id="contract-modal">
    <div class="modal" onclick="event.stopPropagation()" style="width:640px">
        <h2>📋 学习契约</h2>
        <div class="form-group">
            <label>选择教师 <span style="font-weight:400;font-size:12px;color:#636e72">（点击卡片查看详情）</span></label>
            <div class="role-cards" id="contract-role-grid"></div>
        </div>
        <div class="form-group">
            <label>认知深度</label>
            <div class="option-group">
                <button class="option-btn depth-btn" data-depth="basic" onclick="selectDepth('basic')">📖 聚焦基础</button>
                <button class="option-btn depth-btn selected" data-depth="standard" onclick="selectDepth('standard')">📚 标准</button>
                <button class="option-btn depth-btn" data-depth="deep" onclick="selectDepth('deep')">🔍 深入探究</button>
            </div>
        </div>
        <div class="form-group">
            <label>学习时长</label>
            <div class="option-group">
                <button class="option-btn duration-btn" data-duration="15" onclick="selectDuration(15)">⏱ 15分钟</button>
                <button class="option-btn duration-btn selected" data-duration="30" onclick="selectDuration(30)">⏱ 30分钟</button>
                <button class="option-btn duration-btn" data-duration="60" onclick="selectDuration(60)">⏱ 60分钟</button>
            </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-outline" onclick="closeContractModal()">取消</button>
            <button class="btn btn-primary" onclick="confirmContract()">✅ 开始学习</button>
        </div>
    </div>
</div>

<!-- ==================== 教师详情弹窗 ==================== -->
<div class="modal-overlay" id="role-detail-modal">
    <div class="modal" onclick="event.stopPropagation()" style="width:600px;max-height:80vh">
        <div id="role-detail-content">
            <div style="text-align:center;padding:20px;color:#636e72">加载中...</div>
        </div>
    </div>
</div>

<!-- ==================== 风格调控弹窗 ==================== -->
<div class="modal-overlay" id="sliders-modal">
    <div class="modal" onclick="event.stopPropagation()">
        <h2>🎛️ 风格调控</h2>
        <div class="form-group">
            <label>选择角色</label>
            <select id="slider-role-select" onchange="loadSlidersForRole(this.value)"></select>
        </div>
        <div class="slider-group">
            <div class="slider-row">
                <label>严谨 ⇄ 发散</label>
                <input type="range" id="slider-strictness" min="-5" max="5" value="0" oninput="updateSliderLabels()">
                <span class="slider-value" id="strictness-val">0</span>
            </div>
            <div class="slider-row">
                <label>鼓励 ⇄ 严厉</label>
                <input type="range" id="slider-encouragement" min="-5" max="5" value="0" oninput="updateSliderLabels()">
                <span class="slider-value" id="encouragement-val">0</span>
            </div>
            <div class="slider-row">
                <label>简练 ⇄ 详实</label>
                <input type="range" id="slider-verbosity" min="-5" max="5" value="0" oninput="updateSliderLabels()">
                <span class="slider-value" id="verbosity-val">0</span>
            </div>
        </div>
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-outline" onclick="closeSlidersModal()">关闭</button>
            <button class="btn btn-primary" onclick="saveSliders()">💾 保存</button>
        </div>
    </div>
</div>

<!-- ==================== 设置弹窗 ==================== -->
<div class="modal-overlay" id="settings-modal">
    <div class="modal" onclick="event.stopPropagation()">
        <h2>⚙️ LLM 设置</h2>
        <div class="setting-row">
            <label>API Key</label>
            <input type="password" id="setting-api-key" placeholder="输入API Key">
        </div>
        <div class="setting-row">
            <label>API Base URL</label>
            <input type="text" id="setting-base-url" placeholder="https://api.deepseek.com/v1">
        </div>
        <div class="setting-row">
            <label>模型</label>
            <input type="text" id="setting-model" placeholder="deepseek-chat">
        </div>
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-outline" onclick="closeSettingsModal()">关闭</button>
            <button class="btn btn-primary" onclick="saveSettings()">💾 保存</button>
        </div>
    </div>
</div>

<!-- ==================== 划词侧边抽屉 ==================== -->
<div class="annotation-drawer" id="annotation-drawer">
    <div class="drawer-header">
        <h3>💬 追问</h3>
        <button class="drawer-close" onclick="closeAnnotationDrawer()">✕</button>
    </div>
    <div class="drawer-quote" id="drawer-quote"></div>
    <div class="drawer-content" id="annotation-history"></div>
    <div class="drawer-input-area">
        <input type="text" id="annotation-input" placeholder="输入你的追问..." onkeydown="if(event.key==='Enter')sendAnnotation()">
        <button onclick="sendAnnotation()">发送</button>
    </div>
</div>

<!-- ==================== 历史对话查看器 ==================== -->
<div class="modal-overlay" id="history-chat-modal" onclick="if(event.target===this)closeHistoryChatModal()">
    <div class="modal history-chat-modal-panel" onclick="event.stopPropagation()">
        <div class="history-chat-modal-header">
            <h2>💬 历史对话</h2>
            <button class="drawer-close" onclick="closeHistoryChatModal()">✕</button>
        </div>
        <div class="history-chat-modal-body" id="history-chat-content">
            <div class="empty-state" style="padding:40px">
                <p style="color:var(--text-secondary)">加载中...</p>
            </div>
        </div>
        <div class="history-chat-modal-footer">
            <button class="btn btn-outline" onclick="closeHistoryChatModal()">关闭</button>
            <button class="btn btn-primary" onclick="const modal=document.getElementById('history-chat-modal');const body=document.getElementById('history-chat-content');body.scrollTop=0;modal.scrollTop=0;">⬆ 回到顶部</button>
        </div>
    </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
